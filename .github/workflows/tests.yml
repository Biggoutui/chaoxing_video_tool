name: Windows tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure Google Chrome is installed
        run: python -m playwright install chrome
      - name: Run offline tests
        run: python -m unittest -v test_video_tool test_release test_browser
      - name: Check command help
        run: python video_tool.py --help
